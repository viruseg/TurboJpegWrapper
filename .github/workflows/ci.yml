name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash .github/scripts/pack-packages.sh
      - run: bash .github/scripts/verify-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/packages/*.nupkg

  test:
    name: test (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            native: win-x64
          - os: windows-11-arm
            rid: win-arm64
            native: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
            native: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            native: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
            native: osx-universal
          - os: macos-15
            rid: osx-arm64
            native: osx-universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/packages
      - run: dotnet test tests/TurboJpeg.Wrapper.Decoder.Tests/TurboJpeg.Wrapper.Decoder.Tests.csproj -c Release --nologo
      - run: bash .github/scripts/smoke-package.sh ${{ matrix.rid }} ${{ matrix.native }}
        shell: bash
